<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>J.A.R.V.I.S. // Stark Industries Tactical OS</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S." />
    <meta name="application-name" content="J.A.R.V.I.S. Stark OS" />
    <meta name="description" content="Inteligencia Artificial Táctica de Stark Industries con Visión Computacional, Control de Voz y Domótica." />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#030712] text-white select-none overflow-x-hidden antialiased">
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('⚡ J.A.R.V.I.S. PWA ServiceWorker registrado con alcance:', reg.scope))
            .catch((err) => console.warn('PWA ServiceWorker error:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
